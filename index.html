<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151514">
<title>Fit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#151514; --ink:#d6d6d3; --mid:#8a8a85; --faint:#3a3a36; --line:#2a2a27; --press:#22221f;
  --f:"JetBrains Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f);
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  font-feature-settings:"zero" 0, "calt" 0}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
#app{max-width:560px;margin:0 auto;padding:20px 20px 40px}
.mid{color:var(--mid)} .faint{color:var(--faint)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.small{font-size:13px}
h1{font-size:15px;font-weight:500;margin:0}
h2{font-size:26px;line-height:1.2;font-weight:500;margin:0;letter-spacing:-.01em}

/* rest line */
#restline{position:fixed;left:0;right:0;top:0;height:calc(2px + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);pointer-events:none;z-index:5}
#restline i{display:block;height:2px;background:var(--ink);width:0;transform-origin:left}

/* home */
.plan{display:block;width:100%;padding:22px 0;border-top:1px solid var(--line)}
.plan:last-of-type{border-bottom:1px solid var(--line)}
.plan:active{background:var(--press)}
.plan .big{font-size:40px;line-height:1;font-weight:500;letter-spacing:-.02em}
.plan p{margin:10px 0 0;color:var(--mid);font-size:13px}
.links{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:28px;font-size:14px}
.links button{color:var(--mid);padding:8px 0}
.links button:active{color:var(--ink)}
.resume{display:block;width:100%;margin:24px 0 8px;padding:18px;background:var(--ink);color:var(--bg);font-weight:500}

/* progress */
.bar{display:flex;gap:7px;margin:18px 0 6px;height:12px}
.grp{display:flex;gap:2px;flex:var(--n) 1 0}
.seg{flex:1;background:var(--faint);transition:background .15s}
.seg.done{background:var(--ink)}
.seg.next{background:transparent;box-shadow:inset 0 0 0 1px var(--ink)}
.grp.cur{position:relative}
.grp.cur::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--mid)}

/* workout */
.act{display:block;margin:18px 0 0;padding:6px 0;font-size:13px;color:var(--mid)}
.act b{font-weight:400;color:var(--ink)}
.exhead{margin-top:30px}
.variants{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:13px}
.variants button{color:var(--mid);padding:6px 0;border-bottom:1px solid transparent}
.variants button.on{color:var(--ink);border-bottom-color:var(--ink)}
.variants button:disabled{opacity:.5}
.hint{margin-top:10px;font-size:13px}
.hint button{text-decoration:underline;text-underline-offset:3px}
.sets{margin:22px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.sets li{border-bottom:1px solid var(--line)}
.sets button{display:flex;width:100%;gap:18px;padding:11px 0;font-variant-numeric:tabular-nums}
.sets .n{width:1.5em;color:var(--mid)}
.sets .todo{color:var(--faint)}
.sets .cur .n,.sets .edit .n{color:var(--ink)}
.sets .edit{background:var(--press)}

.rest{margin:26px 0 0;display:flex;align-items:baseline;justify-content:space-between}
.rest .t{font-size:64px;line-height:1;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rest button{color:var(--mid);font-size:14px;padding:10px 0}
.step{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;margin-top:14px;border:1px solid var(--line)}
.step button{height:64px;font-size:26px;text-align:center;color:var(--mid)}
.step button:active{background:var(--press);color:var(--ink)}
.step label{display:flex;align-items:baseline;justify-content:center;gap:8px;border-left:1px solid var(--line);border-right:1px solid var(--line);height:64px;align-items:center}
.step input{width:4.2ch;background:none;border:0;text-align:right;font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;padding:0}
.step span{color:var(--mid);font-size:14px;min-width:3.5em}
.primary{display:block;width:100%;margin-top:14px;height:68px;background:var(--ink);color:var(--bg);font-weight:700;text-align:center;font-size:17px}
.primary:active{opacity:.85}
.secondary{display:block;width:100%;margin-top:8px;height:52px;border:1px solid var(--line);text-align:center;color:var(--mid)}
.nav{display:flex;justify-content:space-between;margin-top:22px;font-size:14px}
.nav button{color:var(--mid);padding:10px 0}
.nav button:disabled{opacity:.3}
.done-ex{margin-top:26px;color:var(--mid)}

/* results */
.res{margin-top:16vh}
.res h2{margin-bottom:28px}
.res .l{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .2s}
.res .l.on{opacity:1}
.res .pr{font-size:13px;color:var(--mid);padding:6px 0 0;opacity:0;transition:opacity .2s}
.res .pr.on{opacity:1}

/* history */
.hist{margin:24px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.hist>li{border-bottom:1px solid var(--line)}
.hist .h{display:block;width:100%;padding:14px 0}
.hist .det{padding:0 0 16px;font-size:13px}
.hist .det div{display:flex;justify-content:space-between;gap:16px;padding:3px 0}
.hist .det div span:last-child{text-align:right}
.hist .det .del{color:var(--mid);margin-top:10px;text-decoration:underline;text-underline-offset:3px}
.empty{color:var(--mid);margin-top:24px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;font-size:14px;z-index:9}
/* interwały */
.ivbar{display:flex;gap:2px;height:14px;align-items:flex-end;margin:18px 0 6px}
.ivbar span{background:var(--faint);height:100%}
.ivbar span.e{height:40%}
.ivbar span.done{background:var(--ink)}
.ivbar span.now{background:transparent;box-shadow:inset 0 0 0 1px var(--ink)}
.lock{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:12px;
  padding:24px max(24px,calc((100vw - 520px)/2));touch-action:none;-webkit-user-select:none;user-select:none}
.lock .t{font-size:104px;line-height:1;font-weight:500;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hold{margin-top:48px;height:68px;border:1px solid var(--line);text-align:center;color:var(--mid);
  background:linear-gradient(var(--faint),var(--faint)) no-repeat left/0% 100%;transition:background-size .1s}
.hold.on{background-size:100% 100%;transition:background-size .7s linear;color:var(--ink)}
.rgroup{margin-top:28px}
.rgroup h3{font-size:13px;font-weight:400;color:var(--mid);margin:0 0 4px}
.rrow{display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.rrow .d{display:block;color:var(--mid);font-size:13px;margin-top:2px}
.rrow:active{background:var(--press)}
.hipb{display:flex;align-items:center;gap:10px;margin-top:28px;opacity:1}
.hipb span{margin-right:auto}
.hipb button{border:1px solid var(--line);padding:10px 14px;color:var(--mid)}
.hipb button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(21,21,20,.86);display:flex;align-items:flex-end;justify-content:center;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.modal .box{width:100%;max-width:520px;background:var(--bg);border:1px solid var(--line);padding:22px 20px 20px}
.modal p{margin:0 0 8px;font-size:17px;line-height:1.45}
.plan-val{display:flex;width:100%;justify-content:space-between;align-items:baseline;margin-top:18px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.plan-val .v{font-size:30px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.savebar{position:sticky;bottom:0;z-index:4;margin:0 -20px;padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.savebar .primary{margin-top:0;height:96px;font-size:20px}
.tpbox{margin-top:26px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tpbox .t{font-size:72px;line-height:1;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tpbox #tpPh{font-size:22px;color:var(--ink)}
.tcheck{display:block;margin-top:16px;padding:8px 0;color:var(--mid);font-size:14px}
.cadrow{display:flex;align-items:baseline;gap:12px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.cadrow b{font-weight:500;font-size:20px;font-variant-numeric:tabular-nums}
.metro{display:grid;grid-template-columns:1fr 52px auto 52px;align-items:center;gap:8px;margin-top:10px}
.metro button{height:48px;border:1px solid var(--line);text-align:center;color:var(--mid)}
.metro .mt{text-align:left;padding:0 14px}
.metro .mt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.metro span{text-align:center;font-variant-numeric:tabular-nums;padding:0 4px;white-space:nowrap;font-size:14px}
@media (prefers-reduced-motion:reduce){.seg,.res .l,.res .pr{transition:none}}
</style>
</head>
<body>
<div id="restline"><i></i></div>
<main id="app"></main>
<script>
/* ================== PLAN — edytuj tutaj ==================
   sets: liczba serii, lo/hi: zakres powtórzeń (albo sekund / metrów),
   unit: 'powt.' | 's' | 'm', rest: przerwa w sekundach,
   step: skok ciężaru w kg, start: ciężar na pierwszy raz,
   noWeight: bez ciężaru, variants: wymienne ćwiczenia */
const rep = (n, fn) => Array.from({length:n}, (_, i) => fn(i)).flat();
const ROUND_REST = 75; // przerwa po pełnej rundzie superserii
const PLAN = {
  A: { name: 'Trening A', ex: [
    { id:'squat',  name:'Przysiad ze sztangą',            sets:3, lo:6,  hi:8,  rest:120, step:2.5, start:40, note:'stojak; 2–3 powtórzenia w zapasie' },
    // superserie: dwa ćwiczenia na zmianę przy jednym stanowisku
    { id:'dbbench',name:'Wyciskanie hantli leżąc',         sets:3, lo:8,  hi:10, rest:25, circuit:'a1', step:2, start:20, note:'płaska ławka; ciężar jednego hantla' },
    { id:'row1',   name:'Wiosłowanie hantlem jednorącz',   sets:3, lo:8,  hi:10, rest:25, circuit:'a1', step:2, start:16, note:'na stronę, podparcie na tej samej ławce' },
    { id:'bulg',   name:'Przysiad bułgarski',              sets:3, lo:8,  hi:10, rest:25, circuit:'a2', step:2, start:8,  sides:2, tempo:[3,0,1,0], note:'na stronę, hantle w dłoniach' },
    { id:'calf',   name:'Wspięcia na palce',               sets:3, lo:15, hi:15, rest:25, circuit:'a2', step:2, start:0, tempo:[3,1,1,1], note:'hantel w ręce, krawędź talerza lub stopnia; 0 = bez ciężaru' },
    { id:'face',   name:'Face pull',                       sets:3, lo:12, hi:15, rest:25, circuit:'a3', step:2.5, start:15, tempo:[2,0,1,1], note:'wyciąg, lina na wysokości twarzy' },
    { id:'pallof', name:'Pallof press',                    sets:3, lo:10, hi:10, rest:25, circuit:'a3', step:2.5, start:10, sides:2, tempo:[1,2,1,0], tempoWords:['wypchnij','trzymaj','powrót',''], note:'ten sam wyciąg na wysokości klatki, stojąc bokiem; na stronę' },
  ]},
  B: { name: 'Trening B', ex: [
    { id:'rdl',    name:'Martwy ciąg rumuński',            sets:3, lo:6,  hi:8,  rest:120, step:2.5, start:40, tempo:[3,0,1,0], note:'2–3 powtórzenia w zapasie; w tygodniu testu 5 km o serię mniej' },
    { id:'pull',   name:'Podciąganie',                     sets:3, lo:6,  hi:10, rest:25, circuit:'b1', step:2.5, start:0, note:'ciężar dodatkowy, 0 = masa ciała' },
    { id:'ohp',    name:'Wyciskanie hantli nad głowę',     sets:3, lo:8,  hi:10, rest:25, circuit:'b1', step:2,   start:12, note:'na stojąco przy drążku; ciężar jednego hantla' },
    { id:'incline',name:'Wyciskanie hantli na skosie',     sets:3, lo:10, hi:12, rest:25, circuit:'b2', step:2,   start:14, note:'ciężar jednego hantla' },
    { id:'csrow',  name:'Wiosłowanie w podporze na skosie',sets:3, lo:10, hi:12, rest:25, circuit:'b2', step:2,   start:12, note:'leżąc przodem na tej samej ławce; ciężar jednego hantla' },
    { id:'post',   name:'Tył uda i pośladki',              sets:2, lo:10, hi:12, rest:90,  step:2.5, start:40, variants:[
        { id:'hipthrust', name:'Hip thrust', tempo:[2,0,1,2] },
        { id:'legcurl',   name:'Uginanie nóg na maszynie', start:20 },
        { id:'nordic',    name:'Nordic curl', noWeight:true, lo:4, hi:8, tempo:[4,0,2,0], tempoWords:['opuszczaj','','powrót z rąk',''] } ] },
    { id:'farmer', name:'Spacer farmera',                  sets:3, lo:30, hi:40, rest:90,  step:2,   start:20, unit:'m', note:'ciężar jednego hantla' },
    { id:'fin',    name:'Finiszer: wioślarz',              sets:1, lo:6, hi:6, rest:0, unit:'rund', noWeight:true, optional:true,
      note:'Opcjonalnie, gdy zostaje czas. W tygodniu testu 5 km odpuść.',
      interval: rep(6, i => [
        { k:'work', label:'Mocno', sub:`runda ${i+1} z 6, wioślarz 8–9/10`, dur:30 },
        { k:'easy', label:'Lekko', sub:'spokojne wiosłowanie', dur:60 } ]) },
  ]},
};
PLAN.P = { name:'Pobudka', timed:true, ex: [
  { id:'p1a', name:'Krążenia szyi',                    reps:'5 w każdą stronę',        note:'Powoli, bez szarpania' },
  { id:'p1b', name:'Krążenia barków',                  reps:'10 do tyłu, 10 do przodu', note:'Powoli, pełnym zakresem' },
  { id:'p2',  name:'Krążenia ramion',                  reps:'10 do przodu, 10 do tyłu', note:'Od małych do dużych kół' },
  { id:'p3',  name:'Koci grzbiet / krowa',             reps:'8 cykli',                  note:'Jeden cykl to wdech i wydech' },
  { id:'p4',  name:'Skłony tułowia na boki',           reps:'8 na stronę',              note:'Ręka nad głową, łagodnie' },
  { id:'p5',  name:'Krążenia bioder',                  reps:'8 w każdą stronę',         note:'Duże, spokojne koła' },
  { id:'p6',  name:'Wykroki z rotacją tułowia',        reps:'5 na stronę',              note:'Skręt w stronę nogi z przodu' },
  { id:'p7',  name:'Przysiady',                        reps:'10',                       note:'Pięty na ziemi, spokojne tempo' },
  { id:'p8',  name:'Skłon w przód z rolowaniem w górę', reps:'3',                       note:'Kolana ugięte, prostowanie kręg po kręgu' },
].map(e=>Object.assign({ sets:1, lo:1, hi:1, unit:'', noWeight:true, rest:0 }, e)) };
const ACTIVATION = 'Aktywacja pośladka: mostek 2 × 12, spacer z gumą 2 × 10';

/* ================== BIEGI — plan z dokumentu ==================
   k: 'work' bieg / 'easy' marsz lub trucht / 'prep' przygotowanie
   dur: sekundy (odliczanie), open: odcinek bez czasu, kończysz przyciskiem */
const EASY = 'spokojnie, 3–4/10, rozmawiasz pełnymi zdaniami';
const S = {
  act:  () => ({ k:'prep', label:'Aktywacja pośladka', sub:'mostek 2 × 12, spacer z gumą 2 × 10', open:true, est:120, nolog:true }),
  warm: (sec, sub='marsz, potem lekki trucht') => ({ k:'easy', label:'Rozgrzewka', sub, dur:sec }),
  cool: () => ({ k:'easy', label:'Schłodzenie', sub:'marsz', dur:300 }),
  run:  (min, sub=EASY) => ({ k:'work', label:'Bieg', sub, dur:min*60 }),
  walk: (sec=60) => ({ k:'easy', label:'Marsz', sub:'uspokój oddech', dur:sec }),
  jog:  (sec) => ({ k:'easy', label:'Trucht', sub:'bardzo spokojnie, możesz iść', dur:sec }),
};
const intervals = (n, min) => rep(n, i => [ Object.assign(S.run(min), { sub: `${i+1} z ${n}, ` + EASY }), S.walk(60) ]);
const strides = n => rep(n, i => [ { k:'work', minor:true, label:'Przebieżka', sub:`${i+1} z ${n}, szybko i luźno, 9/10`, dur:15 }, S.walk(45) ]);
const e1 = main => [ S.act(), S.warm(300), ...main, S.cool() ];
const e2 = main => [ S.act(), S.warm(600, 'trucht, rozkręć się powoli'), ...main, S.cool() ];
const RUNS = [
  { id:'e1-1s', stage:1, group:'Etap 1, tydzień 1', name:'Środa',   desc:'5 × (4 min bieg + 1 min marsz)', steps:e1(intervals(5,4)) },
  { id:'e1-1w', stage:1, group:'Etap 1, tydzień 1', name:'Weekend', desc:'6 × (5 min + 1 min)',             steps:e1(intervals(6,5)) },
  { id:'e1-2s', stage:1, group:'Etap 1, tydzień 2', name:'Środa',   desc:'4 × (5 min + 1 min), 4 przebieżki', steps:e1([...intervals(4,5), ...strides(4)]) },
  { id:'e1-2w', stage:1, group:'Etap 1, tydzień 2', name:'Weekend', desc:'5 × (7 min + 1 min)',             steps:e1(intervals(5,7)) },
  { id:'e1-3s', stage:1, group:'Etap 1, tydzień 3', name:'Środa',   desc:'3 × (7 min + 1 min), 5 przebieżek', steps:e1([...intervals(3,7), ...strides(5)]) },
  { id:'e1-3w', stage:1, group:'Etap 1, tydzień 3', name:'Weekend', desc:'4 × (10 min + 1 min)',            steps:e1(intervals(4,10)) },
  { id:'e1-4s', stage:1, group:'Etap 1, tydzień 4 (lżejszy)', name:'Środa',   desc:'3 × (6 min + 1 min)',  steps:e1(intervals(3,6)) },
  { id:'e1-4w', stage:1, group:'Etap 1, tydzień 4 (lżejszy)', name:'Weekend', desc:'3 × (10 min + 1 min)', steps:e1(intervals(3,10)) },
  { id:'e1-5s', stage:1, group:'Etap 1, tydzień 5', name:'Środa',   desc:'2 × (12 min + 1 min), 6 przebieżek', steps:e1([...intervals(2,12), ...strides(6)]) },
  { id:'e1-5w', stage:1, group:'Etap 1, tydzień 5', name:'Weekend', desc:'2 × (15 min + 1 min)',            steps:e1(intervals(2,15)) },
  { id:'e1-6s', stage:1, group:'Etap 1, tydzień 6', name:'Środa',   desc:'20 min ciągiem',                  steps:e1([S.run(20)]) },
  { id:'e1-6w', stage:1, group:'Etap 1, tydzień 6', name:'Weekend', desc:'5 km ciągiem, spokojnie',
    steps:e1([{ k:'work', label:'5 km ciągiem', sub:'spokojnie, na zaliczenie. Stuknij na mecie', open:true, est:2100, tag:'5k' }]) },
  { id:'e2-400', stage:2, group:'Etap 2: środa', name:'400 m', desc:'6 × 400 m szybko, 90 s truchtu',
    steps:e2(rep(6, i => [ { k:'work', label:'400 m', sub:`${i+1} z 6, szybko, 9/10. Stuknij po 400 m`, open:true, est:120 }, S.jog(90) ])) },
  { id:'e2-3m', stage:2, group:'Etap 2: środa', name:'Odcinki 3 min', desc:'5 × 3 min w tempie na 5 km, 2 min truchtu',
    steps:e2(rep(5, i => [ S.run(3, `${i+1} z 5, tempo na 5 km, 8/10`), S.jog(120) ])) },
  { id:'e2-tempo', stage:2, group:'Etap 2: środa', name:'Bieg tempowy', desc:'2 × 8 min tempowo, 2 min truchtu',
    steps:e2([ S.run(8, '1 z 2, komfortowo ciężko, 6–7/10'), S.jog(120), S.run(8, '2 z 2, komfortowo ciężko, 6–7/10') ]) },
  { id:'e2-test', stage:2, group:'Etap 2: środa', name:'Test 5 km', desc:'5 km na czas',
    steps:e2([ { k:'work', label:'5 km na czas', sub:'tempo na 5 km, 8/10. Stuknij na mecie', open:true, est:1800, tag:'5k' } ]) },
  { id:'e2-easy', stage:2, group:'Etap 2: weekend', name:'Spokojny dłuższy', desc:'5–7 km, co 2 tygodnie o 0,5–1 km dłużej',

  const done=work.filter(i=>log[i]!==undefined).length;
  const workMs=work.reduce((a,i)=>a+(log[i]||0),0), cad = (c.cadSteps||0)>=100 && workMs>60000 ? Math.round(c.cadSteps/(workMs/60000)) : null;
  ivStop(); cadStop(); metroCancel();
  if(!done && !keys.length){ db.current=null; save(); sleep(); ui.locked=false; view='home'; render(); return; }
  const prev=best5k(), k5=keys.find(k=>k.tag==='5k');
  const sess={ id:c.id, type:'R', runId:c.runId, name:run.group+', '+run.name, start:c.start, end, entries:[], done, total:work.length, keys, hip:null, cad };
  db.sessions.push(sess);

    pr: k5 ? (prev===null ? 'Pierwszy pomiar 5 km' : k5.ms<prev ? 'Rekord na 5 km, o '+mmss((prev-k5.ms)/1000)+' szybciej' : 'Najlepsze 5 km: '+mmss(prev/1000)) : null };

function timedGo(i){

function draft(){
  if(ui.draft) return ui.draft;
  const cur=db.current, ex=PLAN[cur.type].ex[cur.idx], en=cur.entries[cur.idx], sp=spec(ex,en);
  if(ui.editing!==null){ const s=en.sets[ui.editing]; return ui.draft={w:s.w, r:s.r}; }
  const i=en.sets.length;
  if(i>0) return ui.draft={ w:en.sets[i-1].w, r:en.sets[i-1].r };
  const last=lastFor(keyOf(ex,en));
  if(last) return ui.draft={ w:last[0].w, r:last[0].r };

// odliczanie końca przerwy: 10 s tyknięć co sekundę (ostatnie 3 s dwa razy na sekundę) i dźwięk końca,
// zaplanowane z góry, więc grają w słuchawkach także przy zgaszonym ekranie
function restSchedule(){
  ivCancel();
  const cur=db.current; if(!cur || !cur.restEnd || cur.iv || !db.settings.sound) return;
  const c=ac(); if(!c) return;
  keepAlive(true);
  COLLECT=true;
  try{
    const at=c.currentTime+(cur.restEnd-Date.now())/1000;
    for(let k=10;k>=0.5;k-=(k>3?1:0.5)){ const t=at-k; if(t>c.currentTime+0.02) sfx.beep(k<=3, t); }
    if(at>c.currentTime) sfx.wood(at);

}
/* ---------- przycisk w słuchawkach (play/pauza) zapisuje serię ---------- */
let MA=null;
function silentWav(){
  const n=8000, b=new ArrayBuffer(44+n), v=new DataView(b), w=(o,t)=>[...t].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF'); v.setUint32(4,36+n,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,8000,true); v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,'data'); v.setUint32(40,n,true);
  for(let i=0;i<n;i++) v.setUint8(44+i,128);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}
function headsetOn(){
  if(!db.settings.headset || !db.current || !('mediaSession' in navigator)) return;
  if(!MA){ MA=new Audio(silentWav()); MA.loop=true; }
  MA.play().catch(()=>{});
  try{ navigator.mediaSession.metadata=new MediaMetadata({ title:'Fit: '+curName(db.current), artist:'Przycisk w słuchawkach zapisuje serię' }); }catch(e){}
  ['play','pause','nexttrack'].forEach(a=>{ try{ navigator.mediaSession.setActionHandler(a, headsetPress); }catch(e){} });
  try{ navigator.mediaSession.playbackState='playing'; }catch(e){}
}
function headsetOff(){
  if(MA) MA.pause();
  if('mediaSession' in navigator) ['play','pause','nexttrack'].forEach(a=>{ try{ navigator.mediaSession.setActionHandler(a, null); }catch(e){} });
}
function headsetPress(){
  if(MA) MA.play().catch(()=>{});
  const cur=db.current; if(!cur) return;
  if(cur.type==='R' || cur.iv){ const iv=cur.iv, st=iv&&iv.steps[iv.i]; if(!st) return;
    if(st.open){ const b=$('[data-a=ivdone]'); if(b) b.click(); }
    else { ivPause(); if(cur.iv.paused){ sfx.rest(); buzz([200]); } else { sfx.go(); buzz([80,60,80]); } }
    return; }
  if(PLAN[cur.type].timed) return;
  if(cur.tp){ tpFinish(false); return; }   // w trakcie serii z tempem: koniec teraz
  if(Date.now()-(cur.lastAt||0) < 10000){ sfx.tick(.2); return; }   // ochrona przed podwójnym kliknięciem
  const ex=PLAN[cur.type].ex[cur.idx], en=cur.entries[cur.idx], sp=spec(ex,en);
  if(sp.interval || en.sets.length>=sp.sets){ sfx.rest(); buzz([60,60,60]); return; }  // ćwiczenie zrobione: dokończ na ekranie
  ui.editing=null; ui.extra=null; if(view!=='workout'){ view='workout'; }
  if(tempoOn(ex,en)){ tpStart(); return; }
  saveSet();
}

/* ---------- tempo: metronom serii z liczbą powtórzeń z planu ---------- */
const TEMPO_WORDS=['w dół','pauza','w górę','góra'];
const tempoKey = (ex,en) => en.variant || ex.id;
function tempoOn(ex,en){ const sp=spec(ex,en); return !!sp.tempo && !(db.settings.tempoOff||{})[tempoKey(ex,en)]; }
function tpBuild(tempo, reps, sides){
  const seg=[]; let t=0;
  seg.push({ k:'lead', s:0, d:3 }); t=3;
  for(let side=1; side<=sides; side++){
    if(side>1){ seg.push({ k:'switch', s:t, d:5, side }); t+=5; }
    for(let r=1; r<=reps; r++) tempo.forEach((d,ph)=>{ if(d>0){ seg.push({ k:'ph', ph, rep:r, side, s:t, d }); t+=d; } });
  }
  return { seg, total:t };
}
function tpSchedule(){
  ivCancel();
  const cur=db.current, tp=cur && cur.tp; if(!tp || !db.settings.sound) return;
  const c=ac(); if(!c) return;
  const base=c.currentTime+(tp.t0-Date.now())/1000;
  COLLECT=true;
  try{
    tp.seg.forEach(g=>{
      const at=base+g.s;
      if(g.k==='lead'){ [0,1,2].forEach(k=>{ if(at+k>c.currentTime) sfx.beep(false, at+k); }); return; }
      if(g.k==='switch'){ if(at>c.currentTime) sfx.rest(at); [2,3,4].forEach(k=>{ if(at+k>c.currentTime) sfx.beep(false, at+k); }); return; }
      if(at<c.currentTime) return;
      if(g.ph===0){ sfx.tdown(at); for(let k=1;k<g.d;k++) sfx.tsec(at+k); }
      else if(g.ph===2) sfx.tup(at);
      else if(g.d>=2) for(let k=1;k<g.d;k++) sfx.tsec(at+k);
    });
    const end=base+tp.total; if(end>c.currentTime) sfx.wood(end);
  } finally { COLLECT=false; }
}
function tpStart(){
  const cur=db.current, ex=PLAN[cur.type].ex[cur.idx], en=cur.entries[cur.idx], sp=spec(ex,en), d=draft();
  const reps=Math.max(1, Math.round(num(d.r)));
  cur.restEnd=0; ac(); keepAlive(true);
  cur.tp=Object.assign({ idx:cur.idx, reps, sides:sp.sides||1, tempo:sp.tempo, words:sp.tempoWords||TEMPO_WORDS, t0:Date.now() }, tpBuild(sp.tempo, reps, sp.sides||1));
  tpSchedule(); save(); wake(); render(); scrollTo(0,0);
}
function tpState(){
  const tp=db.current.tp, el=(Date.now()-tp.t0)/1000;
  const g=tp.seg.find(x=>el>=x.s && el<x.s+x.d) || null;
  const side = g ? (g.side||1) : tp.sides;
  const done = tp.seg.filter(x=>x.k==='ph' && x.ph===2 && (x.side||1)===side && x.s+x.d<=el).length;
  return { el, g, side, done };
}
function tpTick(){
  const cur=db.current, tp=cur.tp; if(!tp) return;
  const st=tpState();
  if(st.el>=tp.total){ tpFinish(true); return; }
  const r=$('#tpRep'), ph=$('#tpPh');
  if(r) r.textContent = (st.g && st.g.k==='ph' ? Math.min(st.done+1, tp.reps) : st.done)+' / '+tp.reps;
  if(ph) ph.textContent = !st.g ? '' : st.g.k==='lead' ? 'start za '+Math.ceil(3-st.el) : st.g.k==='switch' ? 'zmiana strony' : (tp.words[st.g.ph]||TEMPO_WORDS[st.g.ph]) + (tp.sides>1 ? ', strona '+st.side : '');
}
function tpFinish(full){
  const cur=db.current, tp=cur.tp; if(!tp) return;
  const st=tpState();
  // przerwane wcześniej: zapisujemy powtórzenia ukończone na bieżącej stronie
  const repsFinal = full ? tp.reps : st.done;
  cur.tp=null; ivCancel(); keepAlive(false);
  if(cur.idx!==tp.idx){ cur.idx=tp.idx; ui.draft=null; }
  if(repsFinal<1){ sfx.rest(); save(); render(); return; }
  const d=draft(); d.r=repsFinal; ui.editing=null; ui.extra=null;
  saveSet();
}
function tpCancel(){ const cur=db.current; if(!cur || !cur.tp) return; cur.tp=null; ivCancel(); keepAlive(false); sfx.rest(); save(); render(); }

function saveSet(){
  const cur=db.current, ex=PLAN[cur.type].ex[cur.idx], en=cur.entries[cur.idx], sp=spec(ex,en), d=draft();
  const s={ w: sp.noWeight?0:num(d.w), r: num(d.r) };
  sfx.click(); buzz(15);
  if(ui.editing!==null){ en.sets[ui.editing]=s; ui.editing=null; ui.draft=null; save(); render(); return; }
  en.sets.push(s); ui.extra=null; cur.lastAt=Date.now();
  cur.restTotal = sp.rest; cur.restEnd = Date.now()+sp.rest*1000; lastTick=null;
  if(ex.circuit){
    const exs=PLAN[cur.type].ex, mem=exs.map((e,i)=>e.circuit===ex.circuit?i:-1).filter(i=>i>=0), r=en.sets.length;
    let nxt=mem.slice(mem.indexOf(cur.idx)+1).find(i=>cur.entries[i].sets.length<r && cur.entries[i].sets.length<exs[i].sets), rest=sp.rest;
    if(nxt===undefined){ nxt=mem.find(i=>cur.entries[i].sets.length<exs[i].sets); rest=ROUND_REST; }
    if(nxt!==undefined){ cur.idx=nxt; cur.restTotal=rest; cur.restEnd=Date.now()+rest*1000; restSchedule(); ui.draft=null; save(); render(); scrollTo(0,0); return; }
    cur.restTotal=ROUND_REST; cur.restEnd=Date.now()+ROUND_REST*1000;
  }
  if(en.sets.length>=sp.sets){
    const nxt = cur.entries.findIndex((e,i)=>i>cur.idx && e.sets.length<PLAN[cur.type].ex[i].sets);
    const any = nxt>=0 ? nxt : cur.entries.findIndex((e,i)=>e.sets.length<PLAN[cur.type].ex[i].sets);
    if(any>=0) cur.idx=any;

}
async function finish(auto){
  const cur=db.current; if(!cur) return;
  if(cur.type==='R'){ finishRun(auto); return; }
  if(cur.tp){ cur.tp=null; ivCancel(); }
  if(cur.iv){ if(!auto && !(await ask('Finiszer trwa. Zakończyć trening?', 'Zakończ'))) return; if(db.current!==cur) return; ivStop(); }
  const entries = cur.entries.filter(e=>e.sets.length);
  if(PLAN[cur.type].timed){
    if(!auto && doneSets(cur)<totalSets(cur) && !(await ask('Pobudka nie jest skończona. Zakończyć?', 'Zakończ'))) return;
    if(db.current!==cur) return;
    const end=endTime(cur);
    if(entries.length) db.sessions.push({ id:cur.id, type:cur.type, start:cur.start, end, entries });
    ui.results={ type:cur.type, timed:true, time:(end-cur.start)/1000, done:doneSets(cur), total:totalSets(cur), vol:0, prs:[] };
    db.current=null; save(); sleep(); view='results'; render(); playResults(); return;
  }
  if(!entries.length){ if(await ask('Brak zapisanych serii. Odrzucić trening?', 'Odrzuć') && db.current===cur){ db.current=null; save(); sleep(); view='home'; render(); } return; }
  if(doneSets(cur)<totalSets(cur) && !(await ask('Nie wszystkie serie są zrobione. Zakończyć i zapisać trening?', 'Zakończ i zapisz'))) return;
  if(db.current!==cur) return;
  const end=endTime(cur);
  // rekordy: szacowany 1RM albo więcej powtórzeń
  const prs=[]; let vol=0;
  entries.forEach(e=>{
    const ex=PLAN[cur.type].ex.find(x=>x.id===e.key); if(!ex) return;
    const sp=spec(ex,e), k=e.variant||e.key;
    const score = s => sp.noWeight ? s.r : (sp.unit==='powt.' ? s.w*(1+s.r/30) : s.w*1000+s.r);
    if(!sp.noWeight && sp.unit==='powt.') e.sets.forEach(s=>vol+=s.w*s.r);
    let prev=-1; db.sessions.forEach(ss=>ss.entries.forEach(x=>{ if((x.variant||x.key)===k) x.sets.forEach(s=>prev=Math.max(prev,score(s))); }));
    const best=e.sets.reduce((a,s)=>score(s)>score(a)?s:a, e.sets[0]);
    if(prev>=0 && score(best)>prev+1e-6) prs.push(sp.name+'  '+setText(best,sp));
  });
  db.sessions.push({ id:cur.id, type:cur.type, start:cur.start, end, entries });
  ui.results={ type:cur.type, time:(end-cur.start)/1000, done:doneSets(cur), total:totalSets(cur), vol, prs };
  db.current=null; save(); sleep(); view='results'; render(); playResults();
}

function tickLoop(){
  if(loopOn) return; loopOn=true;
  const step=()=>{
    const cur=db.current;
    const line=$('#restline i');
    if(cur && cur.iv){ ivTick(); if(cur.type==='R') metroPump(); const clock=$('#clock'); if(clock) clock.textContent=mmss((Date.now()-cur.start)/1000); }
    else if(cur && view==='workout'){

    const top = last.length>=sp.sets && last.every(s=>s.r>=sp.hi);

      h += `<div class="hint">Ostatnio wszystkie serie w górnym zakresie. <button data-a="bump">Dołóż ${fmt(sp.step)} kg</button></div>`;
  }

  for(let k=0;k<Math.max(sp.sets,en.sets.length);k++){

  }

  if(cur.tp && cur.tp.idx===cur.idx){

    h += `<div class="rest"><span class="t" id="restT">${mmss(Math.ceil((cur.restEnd-Date.now())/1000))}</span><button data-a="skip">Pomiń przerwę</button></div>`;
  }
  const complete = en.sets.length>=sp.sets && ui.editing===null && ui.extra!==cur.idx;
  if(complete){
    h += `<div class="done-ex">Ćwiczenie zrobione.</div>`;
    h += done>=total ? `<button class="primary" data-a="finish">Zakończ trening</button>`
                     : `<button class="primary" data-a="nextopen">Następne ćwiczenie</button>`;
    h += `<button class="secondary" data-a="extra">Dodaj serię</button>`;
  } else {
    if(ui.adjust || ui.editing!==null){
      if(!sp.noWeight) h += stepper('w', d.w, 'kg', sp.step);
      h += stepper('r', d.r, sp.unit, sp.unit==='powt.'?1:5);
    } else {
      h += `<button class="plan-val" data-a="adjust"><span class="v">${sp.noWeight?'':fmt(num(d.w))+' kg × '}${fmt(num(d.r))} ${sp.unit}</span><span class="mid small">zmień</span></button>`;
    }
    h += ui.editing!==null
      ? `<button class="primary" data-a="save">Zapisz poprawkę</button><button class="secondary" data-a="delset">Usuń serię</button><button class="secondary" data-a="canceledit">Anuluj</button>`
      : tempoOn(ex,en)
        ? `<button class="tcheck" data-a="tptoggle">[×] Prowadź tempo ${sp.tempo.join('-')}</button>
           <div class="savebar"><button class="primary" data-a="tpstart">Start serii ${en.sets.length+1}</button></div>
           <button class="secondary" data-a="save">Zapisz bez tempa</button>`
        : (sp.tempo ? `<button class="tcheck" data-a="tptoggle">[ ] Prowadź tempo ${sp.tempo.join('-')}</button>` : '')
          + `<div class="savebar"><button class="primary" data-a="save">Zapisz serię ${en.sets.length+1}</button></div>`;
  }
  h += `<div class="nav"><button data-a="prev" ${cur.idx===0?'disabled':''}>‹ Poprzednie</button><button data-a="next" ${cur.idx===plan.ex.length-1?'disabled':''}>Następne ›</button></div>`;
  h += `<div class="links"><button data-a="finish">Zakończ trening</button><button data-a="home">Ekran główny</button></div>`;
  return h;
}

function playResults(){
  const r=ui.results, lines=[...document.querySelectorAll('.res .l')], prs=[...document.querySelectorAll('.res .pr')];
  const show=(el,k,v)=>{ const s=el.lastElementChild;
    s.textContent = k==='time'?mmss(v): k==='sets'? Math.round(v)+'/'+r.total : k==='vol'? fmt(Math.round(v),0)+' kg' : k==='cad'? Math.round(v)+' kr/min' : (v>0?'+':'')+Math.round(v); };
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    lines.forEach(l=>{ l.classList.add('on'); show(l,l.dataset.k,+l.dataset.v); }); prs.forEach(p=>p.classList.add('on')); sfx.fanfare(); return;
  }
  let i=0;
  const next=()=>{
    if(i>=lines.length){ prs.forEach((p,j)=>setTimeout(()=>{p.classList.add('on'); sfx.tick(.2);}, j*160)); setTimeout(()=>sfx.fanfare(), 250+prs.length*160); return; }
    const l=lines[i++], v=+l.dataset.v, k=l.dataset.k; l.classList.add('on');
    const dur = v? 520 : 120, t0=performance.now(); let lastT=0;
    const f=now=>{ const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3); show(l,k,v*e);
      if(now-lastT>55 && p<1){ lastT=now; sfx.tick(.06); }
      if(p<1) requestAnimationFrame(f); else setTimeout(next,170); };
    requestAnimationFrame(f);
  };
  setTimeout(next, 300);
}

/* ================== zdarzenia ================== */
document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a, cur=db.current;
  switch(a){
    case 'start':
      if(cur && !(await ask('Trwa: '+curName(cur)+'. Porzucić go i zacząć nowy?', 'Porzuć i zacznij'))) return;
      if(cur) ivStop();
      startWorkout(b.dataset.t); break;
    case 'runs': view='runs'; render(); scrollTo(0,0); break;
    case 'runstart':
      if(cur && !(await ask('Trwa: '+curName(cur)+'. Porzucić go i zacząć bieg?', 'Porzuć i zacznij'))) return;
      if(cur) ivStop();
      startRun(b.dataset.r); break;
    case 'ivstart': ivStart(spec(PLAN[cur.type].ex[cur.idx],cur.entries[cur.idx]).interval.map(x=>Object.assign({},x)), cur.idx); break;
    case 'ivdone': { const nx=cur.iv.steps[cur.iv.i+1]; sfx.click(); buzz(15); if(nx){ nx.k==='work'?sfx.go():sfx.rest(); } ivGo(cur.iv.i+1, true); break; }
    case 'ivpause': ivPause(); break;
    case 'ivskip': ivGo(cur.iv.i+1, false); break;
    case 'ivprev': ivGo(cur.iv.i-1, false); break;
    case 'lock': ui.locked=true; render(); ivPaint(); break;
    case 'hip': { const ss=db.sessions.find(x=>x.id===ui.results.sid); if(ss){ ss.hip=b.dataset.v; save(); }
      document.querySelectorAll('[data-a=hip]').forEach(x=>x.classList.toggle('on', x.dataset.v===b.dataset.v)); sfx.tick(.2); break; }
    case 'discard': if(cur && await ask('Odrzucić niezakończony trening? Zapisane w nim serie przepadną.', 'Odrzuć')){ ivStop(); db.current=null; save(); sleep(); render(); } break;
    case 'finishcur': view='workout'; render(); finish(); break;
    case 'resume': view='workout'; wake(); render(); ivPaint(); break;
    case 'home': view='home'; ui.results=null; if(!(cur && cur.iv)) sleep(); render(); scrollTo(0,0); break;
    case 'history': view='history'; render(); break;
    case 'open': ui.open = ui.open===b.dataset.id?null:b.dataset.id; render(); break;
    case 'del': if(await ask('Usunąć ten trening z historii?', 'Usuń')){ db.sessions=db.sessions.filter(s=>s.id!==b.dataset.id); save(); render(); } break;
    case 'sound': db.settings.sound=!db.settings.sound; save(); render(); if(db.settings.sound){ ac(); sfx.click(); } break;
    case 'vib': db.settings.vib=!db.settings.vib; save(); render(); buzz(30); break;
    case 'headset': db.settings.headset=!db.settings.headset; save(); render();
      if(db.settings.headset) toast('Na treningu przycisk play/pauza w słuchawkach zapisze serię. Może wstrzymywać muzykę.'); else headsetOff(); break;
    case 'export': {
      const blob=new Blob([JSON.stringify({app:'fit',v:1,sessions:db.sessions},null,1)],{type:'application/json'});
      const u=URL.createObjectURL(blob), l=document.createElement('a'); l.href=u; l.download='fit-kopia-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); break; }
    case 'import': $('#file').click(); break;
    case 'act': cur.act=!cur.act; save(); render(); break;
    case 'go': ui.adjust=false; if(cur.tp) return; cur.idx=+b.dataset.i; ui.draft=null; ui.editing=null; save(); render(); break;
    case 'prev': ui.adjust=false; if(cur.tp) return; if(cur.idx>0){ cur.idx--; ui.draft=null; ui.editing=null; save(); render(); scrollTo(0,0);} break;
    case 'next': ui.adjust=false; if(cur.tp) return; if(cur.idx<PLAN[cur.type].ex.length-1){ cur.idx++; ui.draft=null; ui.editing=null; save(); render(); scrollTo(0,0);} break;
    case 'nextopen': { const i=cur.entries.findIndex((en,i)=>en.sets.length<PLAN[cur.type].ex[i].sets); if(i>=0){ cur.idx=i; ui.draft=null; save(); render(); scrollTo(0,0);} break; }
    case 'variant': cur.entries[cur.idx].variant=b.dataset.v; ui.draft=null; save(); render(); break;
    case 'bump': { const sp=spec(PLAN[cur.type].ex[cur.idx],cur.entries[cur.idx]); const d=draft(); d.w=num(d.w)+sp.step; sfx.tick(.2); render(); break; }
    case 'inc': case 'dec': {
      const d=draft(), f=b.dataset.f, s=+b.dataset.s; let v=num(d[f])+(a==='inc'?s:-s); v=Math.max(0,Math.round(v*100)/100);
      d[f]=v; const inp=$('#in-'+f); if(inp) inp.value=fmt(v,2); sfx.tick(.14); break; }
    case 'save': ui.adjust=false; saveSet(); break;
    case 'adjust': ui.adjust=true; render(); break;
    case 'metro': db.settings.metro=!db.settings.metro; save(); metroCancel(); render(); ivPaint(); break;
    case 'mdec': case 'minc': db.settings.metroSpm=Math.max(130, Math.min(200, metroSpm()+(a==='minc'?2:-2))); save(); metroCancel(); render(); ivPaint(); sfx.tick(.2); break;
    case 'tpstart': ui.adjust=false; tpStart(); break;
    case 'tpstop': tpFinish(false); break;
    case 'tpcancel': tpCancel(); break;
    case 'tptoggle': { const ex=PLAN[cur.type].ex[cur.idx], k=tempoKey(ex,cur.entries[cur.idx]); db.settings.tempoOff=db.settings.tempoOff||{}; db.settings.tempoOff[k]=!db.settings.tempoOff[k]; save(); render(); break; }
    case 'tnext': cur.lastAt=Date.now(); cur.entries[cur.idx].sets=[{w:0,r:1}]; sfx.click(); buzz(15); timedGo(cur.idx+1); break;
    case 'tskip': timedGo(cur.idx+1); break;
    case 'tprev': timedGo(cur.idx-1); break;
    case 'tgo': timedGo(+b.dataset.i); break;
    case 'skip': cur.restEnd=0; ivCancel(); keepAlive(false); save(); render(); break;
    case 'extra': ui.extra=cur.idx; ui.draft=null; render(); break;
    case 'edit': ui.editing=+b.dataset.k; ui.draft=null; render(); break;
    case 'canceledit': ui.editing=null; ui.draft=null; render(); break;
    case 'delset': { const en=cur.entries[cur.idx]; en.sets.splice(ui.editing,1); ui.editing=null; ui.draft=null; save(); render(); break; }
    case 'finish': finish(); break;
  }
});
let holdT=null;
document.addEventListener('pointerdown', e=>{
  if(AC===null || (AC && AC.state==='suspended')){ ac(); if(db.current && db.current.iv){ keepAlive(true); ivSchedule(); } else if(db.current && db.current.tp){ keepAlive(true); tpSchedule(); } else if(db.current && db.current.restEnd) restSchedule(); }
  const h=e.target.closest('#hold'); if(!h) return;
  h.classList.add('on'); holdT=setTimeout(()=>{ ui.locked=false; sfx.tick(.25); render(); ivPaint(); }, 700);
});
['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t, ()=>{ clearTimeout(holdT); const h=$('#hold'); if(h) h.classList.remove('on'); }, true));
document.addEventListener('input', e=>{
  const f=e.target.dataset && e.target.dataset.f; if(!f || !ui.draft) return; ui.draft[f]=e.target.value;
});
document.addEventListener('focusin', e=>{ if(e.target.matches('.step input')) e.target.select(); });
document.addEventListener('change', e=>{
  if(e.target.id!=='file') return; const file=e.target.files[0]; if(!file) return;
  file.text().then(t=>{
    const d=JSON.parse(t); if(!d || !Array.isArray(d.sessions)) throw 0;
    const ids=new Set(db.sessions.map(s=>s.id)); let n=0;
    d.sessions.forEach(s=>{ if(s && s.id && !ids.has(s.id)){ db.sessions.push(s); n++; } });
    db.sessions.sort((a,b)=>a.start-b.start); save(); render(); toast(n? 'Wczytano treningi: '+n : 'Brak nowych treningów w pliku');
  }).catch(()=>toast('To nie jest plik kopii z tej aplikacji'));
});

render(); tickLoop(); if(view==='workout') wake();
if(db.current && db.current.type==='R') cadStart();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
